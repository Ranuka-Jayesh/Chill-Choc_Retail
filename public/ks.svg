<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3AD8D2"/>
      <stop offset="1" stop-color="#18B9B4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD65A"/>
      <stop offset="1" stop-color="#FFB224"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4A211B" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#soft)" stroke="#4A211B" stroke-linecap="round" stroke-linejoin="round">

    <!-- floating shortcut keys -->
    <g font-family="Arial Rounded MT Bold, Arial, sans-serif" font-weight="800" text-anchor="middle">
      <g transform="translate(120,170) rotate(-8)">
        <rect width="210" height="105" rx="24" fill="#FFF9EE" stroke-width="14"/>
        <text x="105" y="70" font-size="52" fill="#4A211B" stroke="none">Ctrl</text>
      </g>
      <g transform="translate(85,330) rotate(-5)">
        <rect width="200" height="105" rx="24" fill="#FFF9EE" stroke-width="14"/>
        <text x="100" y="70" font-size="52" fill="#4A211B" stroke="none">Alt</text>
      </g>
      <g transform="translate(85,490) rotate(-6)">
        <rect width="230" height="105" rx="24" fill="#FFF9EE" stroke-width="14"/>
        <text x="115" y="70" font-size="48" fill="#4A211B" stroke="none">Shift</text>
      </g>
      <g transform="translate(930,250) rotate(7)">
        <rect width="180" height="105" rx="24" fill="#FFF9EE" stroke-width="14"/>
        <text x="90" y="70" font-size="58" fill="#4A211B" stroke="none">⌘</text>
      </g>
      <g transform="translate(955,450) rotate(6)">
        <rect width="170" height="105" rx="24" fill="#FFF9EE" stroke-width="14"/>
        <text x="85" y="70" font-size="52" fill="#4A211B" stroke="none">Fn</text>
      </g>
    </g>

    <!-- sparkles -->
    <g fill="url(#gold)" stroke-width="9">
      <path d="M140 720 l14 28 28 14-28 14-14 28-14-28-28-14 28-14z"/>
      <path d="M1010 720 l14 28 28 14-28 14-14 28-14-28-28-14 28-14z"/>
    </g>

    <!-- lightbulb -->
    <g transform="translate(860,90)">
      <circle cx="90" cy="90" r="72" fill="url(#gold)" stroke-width="14"/>
      <path d="M90 55 q-30 25 0 55 q30-30 0-55z" fill="#FFF7D8" stroke="none"/>
      <rect x="63" y="145" width="55" height="34" rx="12" fill="#6B4B47" stroke-width="10"/>
      <path d="M15 90 h-35 M160 90 h35 M35 25 l-25 -25 M145 25 l25 -25" fill="none" stroke="url(#gold)" stroke-width="14"/>
    </g>

    <!-- panda ears -->
    <circle cx="405" cy="245" r="85" fill="#6E4B47" stroke-width="16"/>
    <circle cx="795" cy="255" r="85" fill="#6E4B47" stroke-width="16"/>

    <!-- head -->
    <circle cx="600" cy="430" r="245" fill="#FFF8E9" stroke-width="18"/>

    <!-- beanie -->
    <path d="M435 245 Q600 85 765 245 Q600 190 435 245z" fill="url(#gold)" stroke-width="16"/>
    <path d="M460 200 Q600 98 740 200" fill="none" stroke="#FF625B" stroke-width="44"/>
    <path d="M465 250 Q600 220 745 250" fill="none" stroke="url(#teal)" stroke-width="52"/>
    <circle cx="600" cy="95" r="46" fill="#27CAC3" stroke-width="14"/>

    <!-- face -->
    <ellipse cx="510" cy="435" rx="78" ry="98" fill="#6E4B47" stroke="none" transform="rotate(15 510 435)"/>
    <ellipse cx="690" cy="430" rx="78" ry="98" fill="#6E4B47" stroke="none" transform="rotate(-15 690 430)"/>
    <path d="M478 435 q32 36 60 0" fill="none" stroke-width="14"/>
    <path d="M658 430 q32 36 60 0" fill="none" stroke-width="14"/>
    <ellipse cx="440" cy="525" rx="38" ry="24" fill="#FF9087" stroke="none"/>
    <ellipse cx="760" cy="520" rx="38" ry="24" fill="#FF9087" stroke="none"/>
    <ellipse cx="600" cy="485" rx="23" ry="16" fill="#4A211B" stroke="none"/>
    <path d="M600 500 q0 28 -28 28 M600 500 q0 28 28 28" fill="none" stroke-width="10"/>
    <path d="M572 530 q28 43 58 0" fill="#FF766E" stroke-width="10"/>

    <!-- arms -->
    <path d="M455 590 q25 70 100 95" fill="none" stroke="#6E4B47" stroke-width="72"/>
    <path d="M745 590 q-25 70 -100 95" fill="none" stroke="#6E4B47" stroke-width="72"/>

    <!-- keyboard -->
    <g transform="translate(235,650)">
      <rect width="730" height="250" rx="45" fill="#F6F0E9" stroke-width="18"/>
      <g fill="#FFFDFC" stroke="#66504A" stroke-width="7">
        <rect x="45" y="42" width="92" height="56" rx="12"/>
        <rect x="150" y="42" width="92" height="56" rx="12"/>
        <rect x="255" y="42" width="92" height="56" rx="12"/>
        <rect x="360" y="42" width="92" height="56" rx="12"/>
        <rect x="465" y="42" width="92" height="56" rx="12"/>
        <rect x="570" y="42" width="92" height="56" rx="12"/>
        <rect x="45" y="113" width="112" height="56" rx="12" fill="#40D3CD"/>
        <rect x="170" y="113" width="92" height="56" rx="12"/>
        <rect x="275" y="113" width="92" height="56" rx="12"/>
        <rect x="380" y="113" width="92" height="56" rx="12"/>
        <rect x="485" y="113" width="92" height="56" rx="12"/>
        <rect x="590" y="113" width="92" height="56" rx="12" fill="#FFC63F"/>
        <rect x="45" y="184" width="125" height="40" rx="12"/>
        <rect x="185" y="184" width="365" height="40" rx="12"/>
        <rect x="565" y="184" width="117" height="40" rx="12"/>
      </g>
    </g>

    <!-- text -->
    <text x="600" y="1030"
      font-family="Arial Rounded MT Bold, Baloo 2, Arial, sans-serif"
      font-size="160" font-weight="900" text-anchor="middle"
      fill="url(#teal)" stroke="#FFF8E9" stroke-width="36" paint-order="stroke">Keyboard</text>
    <text x="600" y="1030"
      font-family="Arial Rounded MT Bold, Baloo 2, Arial, sans-serif"
      font-size="160" font-weight="900" text-anchor="middle"
      fill="url(#teal)" stroke="#4A211B" stroke-width="18" paint-order="stroke">Keyboard</text>

    <text x="600" y="1160"
      font-family="Arial Rounded MT Bold, Baloo 2, Arial, sans-serif"
      font-size="140" font-weight="900" text-anchor="middle"
      fill="url(#gold)" stroke="#FFF8E9" stroke-width="34" paint-order="stroke">Shortcuts</text>
    <text x="600" y="1160"
      font-family="Arial Rounded MT Bold, Baloo 2, Arial, sans-serif"
      font-size="140" font-weight="900" text-anchor="middle"
      fill="url(#gold)" stroke="#4A211B" stroke-width="18" paint-order="stroke">Shortcuts</text>
  </g>
</svg>
